name: CI - Validação de Infraestrutura

# Roda em todo push/PR: valida Terraform, Ansible, YAML e docker-compose
# antes de qualquer coisa ser aplicada de verdade. É a mesma lógica usada
# em pipelines reais de times de infra/plataforma.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (backend local, sem provider real)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ansible-lint
        run: pip install ansible-lint

      - name: Rodar ansible-lint
        working-directory: ansible
        run: ansible-lint playbook.yml

  yaml-lint:
    name: YAML lint (compose, prometheus, grafana, workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar yamllint
        run: pip install yamllint

      - name: Rodar yamllint
        run: yamllint -c .yamllint.yml .

  docker-compose-config:
    name: Validar docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar sintaxe do compose
        run: docker compose config -q
