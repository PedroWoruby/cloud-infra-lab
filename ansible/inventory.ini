# Inventário estático do laboratório.
# ansible_connection=community.docker.docker faz o Ansible "entrar" direto
# no container via docker exec, sem precisar de SSH — perfeito para um
# ambiente de estudo local. Em um cenário com EC2 de verdade, essas linhas
# viram IPs/DNS reais com ansible_connection=ssh.

[webservers]
web-01 ansible_connection=community.docker.docker
web-02 ansible_connection=community.docker.docker

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
